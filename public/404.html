<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <title>Στέργιος Χατζηκυριακίδης</title>
    <meta name="robots" content="noindex" />
    <style>html{background:#f5f0e6}</style>
    <script>
      // GitHub Pages SPA fallback (spa-github-pages pattern).
      // Custom domain at the apex of the site (base '/'): keep 0 path segments.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
